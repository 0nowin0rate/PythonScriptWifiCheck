[project]
name = "wifi-connect"
version = "0.1.0"
description = "Captive-portal WiFi auto-connector using Firefox + Selenium"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "requests>=2.28",
]

[project.scripts]
wifi-connect = "wifi_connect:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
